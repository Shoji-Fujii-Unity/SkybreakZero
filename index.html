<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#03050c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SKYBREAK ZERO ― 蒼穹のレイド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03050c;color:#e6f6ff;
  font-family:ui-monospace,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",Menlo,Consolas,monospace;
  overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(130% 140% at 50% -10%,#0d1636 0%,#04070f 62%,#01030a 100%)}
#stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));
  overflow:hidden;font-size:clamp(9px,min(2.05vw,3.7vh),17px);box-shadow:0 0 80px rgba(0,0,0,.85),0 0 0 1px rgba(90,220,255,.14)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
canvas{display:block;width:100%;height:100%}
.hidden{display:none !important}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:4;padding:.5em .7em;display:flex;justify-content:space-between;text-shadow:0 0 8px rgba(0,0,0,.9)}
.hud-col{display:flex;flex-direction:column;gap:.15em;line-height:1.25}
.hud-col.r{align-items:flex-end;text-align:right}
.k{opacity:.62;font-size:.72em;letter-spacing:.14em;margin-right:.4em}
.v{font-weight:700;font-size:1.05em;letter-spacing:.06em;color:#9ff0ff}
#hMult{color:#ffe06a;font-size:.82em;letter-spacing:.1em}
.ic{color:#ff7ad9;font-size:.9em;letter-spacing:.08em}
.ic.b{color:#ffd166}
#bossWrap{position:absolute;left:50%;top:.45em;transform:translateX(-50%);width:min(52%,30em);text-align:center;opacity:0;transition:opacity .3s}
#bossWrap.on{opacity:1}
#bossWrap .bk{font-size:.66em;letter-spacing:.28em;color:#ff8491;text-shadow:0 0 10px rgba(255,60,90,.65);margin-bottom:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:.55em;background:rgba(6,12,28,.75);border:1px solid rgba(255,120,140,.55);border-radius:2px;box-shadow:0 0 12px rgba(255,60,90,.25);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff2e63,#ff7a59,#ffd166);box-shadow:0 0 10px rgba(255,120,100,.8);transition:width .15s linear}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 19%,rgba(0,0,0,.35) 19% 20%);pointer-events:none}
#bossWrap.danger .bar{animation:bdanger .45s ease-in-out infinite alternate}
@keyframes bdanger{from{box-shadow:0 0 10px rgba(255,60,90,.35)}to{box-shadow:0 0 20px rgba(255,80,110,.9)}}

/* ---------- banner ---------- */
#banner{position:absolute;left:0;right:0;top:32%;z-index:5;text-align:center;pointer-events:none;opacity:0;
  font-size:2.1em;font-weight:800;letter-spacing:.16em;color:#c9f4ff;text-shadow:0 0 18px rgba(80,220,255,.75)}
#banner.show{animation:bn 2s ease-out forwards}
#banner.warn{color:#ff8b95;text-shadow:0 0 22px rgba(255,60,90,.9)}
#banner.warn.show{animation:bnw 2.4s linear forwards}
#banner.clear{color:#8dffb6;text-shadow:0 0 24px rgba(60,255,150,.75);font-size:2.4em}
@keyframes bn{0%{opacity:0;transform:scale(1.35)}18%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0}}
@keyframes bnw{0%,100%{opacity:0}10%,90%{opacity:1}20%,60%{filter:brightness(1.8)}}

/* ---------- pads ---------- */
#pads{position:absolute;inset:0;z-index:5;pointer-events:none}
.pad{position:absolute;pointer-events:auto;border:1px solid rgba(140,230,255,.45);border-radius:999px;
  background:radial-gradient(circle at 35% 30%,rgba(70,180,255,.35),rgba(10,20,45,.55));color:#eafaff;
  font-family:inherit;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(2px);box-shadow:0 0 16px rgba(0,0,0,.5)}
.pad:active{background:radial-gradient(circle at 35% 30%,rgba(160,240,255,.6),rgba(20,60,110,.7))}
#btnBomb{right:max(.6em,env(safe-area-inset-right));bottom:max(.6em,env(safe-area-inset-bottom));
  width:5.4em;height:5.4em;font-size:1.05em;border-color:rgba(255,190,90,.7);color:#ffe8b8}
#btnBomb.empty{opacity:.35;border-color:rgba(255,190,90,.25)}  
.mini{top:max(.5em,env(safe-area-inset-top));width:2.6em;height:2.6em;font-size:.9em;opacity:.85}
#btnPause{right:calc(max(.5em,env(safe-area-inset-right)) + 3em)}
#btnFs{right:max(.5em,env(safe-area-inset-right))}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;gap:2.2em;padding:1em 1.4em;
  background:linear-gradient(105deg,rgba(3,6,16,.95) 0%,rgba(6,12,30,.86) 55%,rgba(10,18,44,.7) 100%);overflow:auto;flex-wrap:wrap}
.brand{min-width:min(100%,17em);flex:1 1 17em}
.logo{font-size:2.5em;font-weight:900;letter-spacing:.06em;line-height:1;
  background:linear-gradient(180deg,#ffffff 15%,#7de8ff 55%,#2a8cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(60,190,255,.55))}
.logo small{display:block;font-size:.3em;letter-spacing:.42em;color:#8fd8ff;-webkit-text-fill-color:#8fd8ff;margin-top:.35em}
.tag{margin:.7em 0 1.1em;font-size:.95em;color:#a9cbe6;line-height:1.6}
.panel{flex:1 1 20em;min-width:min(100%,20em);border:1px solid rgba(120,220,255,.22);border-radius:.7em;padding:1em 1.1em;background:rgba(4,10,26,.55);backdrop-filter:blur(3px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:.8em;margin:.5em 0;flex-wrap:wrap}
.lab{font-size:.76em;letter-spacing:.16em;opacity:.72}
.btn{cursor:pointer;font-family:inherit;color:#eafaff;border:1px solid rgba(120,225,255,.45);border-radius:.45em;
  padding:.55em 1.05em;font-size:.9em;font-weight:700;letter-spacing:.1em;background:linear-gradient(180deg,rgba(38,110,190,.5),rgba(12,30,64,.6));
  transition:transform .08s,box-shadow .15s,background .15s}
.btn:hover{box-shadow:0 0 16px rgba(90,220,255,.35);background:linear-gradient(180deg,rgba(55,145,240,.6),rgba(16,42,86,.7))}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.big{font-size:1.15em;padding:.62em 1.3em;border-color:#8ff0ff;box-shadow:0 0 22px rgba(60,200,255,.3)}
.btn.warnbtn{border-color:rgba(255,120,140,.6);color:#ffd9de;background:linear-gradient(180deg,rgba(170,40,70,.45),rgba(50,12,26,.6))}
.btn.on{border-color:#7dffb0;color:#e6ffee;box-shadow:0 0 14px rgba(90,255,160,.28)}
.chips{display:flex;flex-wrap:wrap;gap:.35em}
.chip{cursor:pointer;font-family:inherit;font-size:.74em;letter-spacing:.06em;padding:.34em .6em;border-radius:.35em;
  border:1px solid rgba(120,220,255,.28);background:rgba(10,24,52,.6);color:#cfe9f8}
.chip.sel{border-color:#8ff0ff;background:rgba(30,120,200,.55);color:#fff;box-shadow:0 0 12px rgba(90,220,255,.4)}
.note{font-size:.7em;line-height:1.7;opacity:.6;margin-top:.7em}
.stats{display:flex;gap:1.4em;flex-wrap:wrap;font-size:.78em;margin-bottom:.4em}
.stats b{color:#ffe06a;font-size:1.25em;display:block}
.big-title{width:100%;text-align:center;font-size:2.2em;font-weight:900;letter-spacing:.14em}
.big-title.over{color:#ff7d8c;text-shadow:0 0 24px rgba(255,60,90,.6)}
.rec{color:#ffe06a;font-size:.9em;letter-spacing:.2em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.grid{display:grid;grid-template-columns:auto auto;gap:.2em 1.4em;font-size:.86em;margin:.6em 0;justify-content:center;text-align:left}
.grid span:nth-child(odd){opacity:.65;letter-spacing:.1em;font-size:.82em}
.howtxt{font-size:.82em;line-height:1.9;white-space:pre-line;color:#c9e3f5}

/* ---------- portrait guard ---------- */
#rotate{display:none;position:fixed;inset:0;z-index:99;background:#04070f;align-items:center;justify-content:center;text-align:center;padding:2em}
#rotate .ph{font-size:64px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){ #app{display:none} #rotate{display:flex} }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-col">
        <div><span class="k" data-i18n="score"></span><b class="v" id="hScore">0</b></div>
        <div><span class="k" data-i18n="best"></span><b class="v" id="hBest">0</b></div>
        <div id="hMult">x1.0</div>
      </div>
      <div class="hud-col r">
        <div><span class="k" data-i18n="stage_word"></span><b class="v" id="hStage">1</b></div>
        <div class="ic" id="hLives">&#9670;&#9670;&#9670;</div>
        <div class="ic b" id="hBombs">&#10023;&#10023;&#10023;</div>
      </div>
      <div id="bossWrap"><div class="bk" id="bossName">BOSS</div><div class="bar"><i id="bossBar"></i></div></div>
    </div>

    <div id="pads" class="hidden">
      <button id="btnPause" class="pad mini">II</button>
      <button id="btnFs" class="pad mini">&#8862;</button>
      <button id="btnBomb" class="pad">BOMB</button>
    </div>

    <div id="banner"></div>

    <!-- TITLE -->
    <section id="sTitle" class="screen">
      <div class="brand">
        <h1 class="logo">SKYBREAK ZERO<small>蒼穹のレイド</small></h1>
        <p class="tag" data-i18n="tagline"></p>
        <div class="row" style="gap:.5em">
          <button class="btn big" id="bStart" data-i18n="press_start"></button>
          <button class="btn" id="bCont" data-i18n="cont"></button>
        </div>
        <div class="row" style="gap:.5em">
          <button class="btn" id="bHow" data-i18n="howto"></button>
          <button class="btn" id="bSet" data-i18n="settings"></button>
        </div>
      </div>
      <div class="panel">
        <div class="stats">
          <div><span data-i18n="best_score"></span><b id="tBest">0</b></div>
          <div><span data-i18n="best_stage"></span><b id="tStage">1</b></div>
          <div><span data-i18n="kills"></span><b id="tKills">0</b></div>
          <div><span data-i18n="plays"></span><b id="tPlays">0</b></div>
        </div>
        <div class="row"><span class="lab" data-i18n="lang"></span><div class="chips" id="langChips"></div></div>
        <div class="row"><span class="lab" data-i18n="sound"></span>
          <div style="display:flex;gap:.4em">
            <button class="btn" id="bMusic" style="font-size:.76em"></button>
            <button class="btn" id="bSfx" style="font-size:.76em"></button>
          </div>
        </div>
        <p class="note" data-i18n="save_note"></p>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="sSet" class="screen hidden">
      <div class="panel" style="max-width:34em">
        <div class="big-title" style="font-size:1.2em;margin-bottom:.6em" data-i18n="settings"></div>
        <div class="row"><span class="lab" data-i18n="lang"></span><div class="chips" id="langChips2"></div></div>
        <div class="row"><span class="lab" data-i18n="music"></span><button class="btn" id="bMusic2"></button></div>
        <div class="row"><span class="lab" data-i18n="sfx"></span><button class="btn" id="bSfx2"></button></div>
        <div class="row"><span class="lab" data-i18n="difficulty"></span>
          <div style="display:flex;gap:.35em">
            <button class="chip" data-diff="easy"></button><button class="chip" data-diff="normal"></button><button class="chip" data-diff="hard"></button>
          </div>
        </div>
        <div class="row"><span class="lab" data-i18n="fullscreen"></span><button class="btn" id="bFs2"></button></div>
        <div class="row"><span class="lab" data-i18n="reset_save"></span><button class="btn warnbtn" id="bReset" style="font-size:.76em">DELETE</button></div>
        <p class="note" data-i18n="save_note"></p>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="bSetBack" data-i18n="back"></button></div>
      </div>
    </section>

    <!-- HOW TO -->
    <section id="sHow" class="screen hidden">
      <div class="panel" style="max-width:38em">
        <div class="big-title" style="font-size:1.2em;margin-bottom:.6em" data-i18n="howto"></div>
        <p class="howtxt" id="howBody"></p>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="bHowBack" data-i18n="back"></button></div>
      </div>
    </section>

    <!-- PAUSE -->
    <section id="sPause" class="screen hidden">
      <div class="panel" style="max-width:24em;text-align:center">
        <div class="big-title" style="font-size:1.5em;margin-bottom:.8em" data-i18n="pause"></div>
        <div class="row" style="justify-content:center;gap:.6em"><button class="btn big" id="bResume" data-i18n="resume"></button></div>
        <div class="row" style="justify-content:center;gap:.6em">
          <button class="btn" id="bHow2" data-i18n="howto"></button>
          <button class="btn warnbtn" id="bQuit" data-i18n="quit_title"></button>
        </div>
      </div>
    </section>

    <!-- RESULT -->
    <section id="sResult" class="screen hidden">
      <div class="panel" style="max-width:26em;text-align:center">
        <div class="big-title over" id="rTitle" data-i18n="gameover"></div>
        <div class="rec hidden" id="rRec" data-i18n="new_record"></div>
        <div class="grid">
          <span data-i18n="final_score"></span><b id="rScore">0</b>
          <span data-i18n="best_score"></span><b id="rBest">0</b>
          <span data-i18n="reached"></span><b id="rStage">1</b>
        </div>
        <div class="row" style="justify-content:center;gap:.6em">
          <button class="btn big" id="bRetry" data-i18n="retry"></button>
          <button class="btn" id="bTitle" data-i18n="to_title"></button>
        </div>
      </div>
    </section>
  </div>
</div>
<div id="rotate"><div><div class="ph">&#128241;</div><p style="margin-top:1em;letter-spacing:.08em" data-i18n="rotate_msg"></p></div></div>

      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-R * 0.6, ty);
      ctx.quadraticCurveTo(-R * 1.15, ty + wob, -R * 1.6, ty - wob * 0.6);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(0, 0, R * 0.85, R * 0.7, 0, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(R * 0.22, -R * 0.22, R * 0.1, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(R * 0.22, R * 0.22, R * 0.1, 0, 6.283); ctx.fill();
  } else {
    ctx.beginPath();
    for (k = 0; k < 8; k++) { a = k / 8 * 6.283 + G.t * 0.4; ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.rotate(-G.t * 1.1);
    for (k = 0; k < 4; k++) {
      a = k / 4 * 6.283;
      var ox = Math.cos(a) * R * 0.62, oy2 = Math.sin(a) * R * 0.62;
      ctx.fillStyle = "rgba(255,255,255,.22)";
      ctx.fillRect(ox - R * 0.11, oy2 - R * 0.11, R * 0.22, R * 0.22);
    }
    ctx.restore();
  }
  ctx.fillStyle = e.hp < e.maxhp * 0.5 ? "#ffffff" : c;
  ctx.beginPath(); ctx.arc(0, 0, R * (0.18 + 0.04 * Math.sin(G.t * 6)), 0, 6.283); ctx.fill();
}
function playerDraw() {
  if (!P.alive) { return; }
  var x = P.x, y = P.y;
  var blink = P.inv > 0 && (((G.t * 22) | 0) % 2 === 0);
  var bank = P.vy * 0.22;
  ctx.save(); ctx.translate(x, y); ctx.scale(1, 1 - Math.abs(bank) * 0.45); ctx.rotate(bank * 0.35);
  ctx.globalAlpha = blink ? 0.4 : 1;

  /* Thruster glow & dual-layer plasma flame */
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  var fl = 30 + Math.random() * 14;
  var fg = ctx.createLinearGradient(-fl, 0, -14, 0);
  fg.addColorStop(0, "rgba(70,190,255,0)"); fg.addColorStop(0.6, "rgba(110,235,255,.75)"); fg.addColorStop(1, "#ffffff");
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.moveTo(-14, -4.5); ctx.lineTo(-fl, 0); ctx.lineTo(-14, 4.5); ctx.closePath(); ctx.fill();
  if (P.muzzle > 0) {
    ctx.globalAlpha = (P.muzzle / 0.055) * 0.7;
    ctx.fillStyle = "#b9f4ff";
    ctx.beginPath(); ctx.ellipse(21, 0, 7, 4, 0, 0, 6.283); ctx.fill();
  }
  ctx.restore();

  /* Metallic hull gradient */
  var hg = ctx.createLinearGradient(-16, -13, 18, 13);
  hg.addColorStop(0, "#102850"); hg.addColorStop(0.5, "#1a4a82"); hg.addColorStop(1, "#0b1a36");
  ctx.fillStyle = hg; ctx.strokeStyle = "#9ef0ff"; ctx.lineWidth = 1.9;
  ctx.beginPath();
  ctx.moveTo(21, 0); ctx.lineTo(3, -6.5); ctx.lineTo(-7, -5); ctx.lineTo(-15, -14); ctx.lineTo(-17, -4);
  ctx.lineTo(-17, 4); ctx.lineTo(-15, 14); ctx.lineTo(-7, 5); ctx.lineTo(3, 6.5);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  /* Wingtip accents */
  ctx.fillStyle = "#5ad8ff";
  ctx.fillRect(-15, -13.5, 5, 2); ctx.fillRect(-15, 11.5, 5, 2);

  /* Glowing canopy */
  var cg = ctx.createLinearGradient(0, -3, 11, 3);
  cg.addColorStop(0, "#ffffff"); cg.addColorStop(0.4, "#7ceeff"); cg.addColorStop(1, "#1e78d6");
  ctx.fillStyle = cg; ctx.beginPath(); ctx.ellipse(6, 0, 5.5, 2.8, 0, 0, 6.283); ctx.fill();

  /* Weapon pods */
  for (var i = 0; i < P.level - 1; i++) {
    var o = (i % 2 ? 1 : -1) * (8 + ((i / 2) | 0) * 5);
    ctx.fillStyle = "rgba(130,235,255,.7)"; ctx.fillRect(-6, o - 1.6, 12, 3.2);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(4, o - 1, 3, 2);
  }
  ctx.restore();

  /* Energy Shield */
  if (P.shield > 0) {
    ctx.save(); ctx.translate(x, y);
    var sr = 20 + P.shield * 1.5;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.25 + 0.12 * Math.sin(G.t * 6);
    var sg = ctx.createRadialGradient(0, 0, sr * 0.4, 0, 0, sr);
    sg.addColorStop(0, "rgba(125,255,208,0)"); sg.addColorStop(1, "#7dffd0");
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 0, sr, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 0.65 + 0.2 * Math.sin(G.t * 8);
    ctx.strokeStyle = "#7dffd0"; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 0, sr, 0, 6.283); ctx.stroke();
    ctx.restore();
  }

  /* Crisp hitbox core */
  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.283); ctx.fill();
}
function partsDraw() {
  var i, p, a;
  /* Pass 1: smoke & debris shards */
  for (i = 0; i < parts.length; i++) {
    p = parts[i];
    if (p.kind !== "smoke" && p.kind !== "shard") { continue; }
    a = Math.max(0, p.life / p.max);
    if (p.kind === "smoke") {
      ctx.globalAlpha = a * 0.38; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.35 - a * 0.4), 0, 6.283); ctx.fill();
    } else {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.globalAlpha = Math.min(1, a * 1.3); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.moveTo(p.r, 0); ctx.lineTo(-p.r * 0.7, -p.r * 0.6); ctx.lineTo(-p.r * 0.4, p.r * 0.7); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  /* Pass 2: additive glow, sparks, and shockwave rings */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (i = 0; i < parts.length; i++) {
    p = parts[i];
    if (p.kind === "smoke" || p.kind === "shard") { continue; }
    a = Math.max(0, p.life / p.max);
    if (p.kind === "ring") {
      var rr = lerp(p.r, p.r1, 1 - a);
      ctx.globalAlpha = a * 0.85; ctx.strokeStyle = p.c; ctx.lineWidth = Math.max(0.8, p.lw * a);
      ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 6.283); ctx.stroke();
    } else if (p.kind === "spark") {
      var spd = Math.hypot(p.vx, p.vy) || 1;
      var len = Math.min(18, Math.max(4, spd * 0.045)) * a;
      var nx = p.vx / spd, ny = p.vy / spd;
      ctx.globalAlpha = Math.min(1, a * 1.2); ctx.strokeStyle = p.c; ctx.lineWidth = p.r;
      ctx.beginPath(); ctx.moveTo(p.x - nx * len, p.y - ny * len); ctx.lineTo(p.x + nx * len * 0.4, p.y + ny * len * 0.4); ctx.stroke();
    } else {
      ctx.globalAlpha = a; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.9), 0, 6.283); ctx.fill();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
function textsDraw() {
  ctx.textAlign = "center"; ctx.font = "bold 15px ui-monospace,monospace";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(3,6,18,.85)";
  for (var i = 0; i < texts.length; i++) {
    var x = texts[i];
    ctx.globalAlpha = Math.min(1, x.t * 1.6);
    ctx.strokeText(x.s, x.x, x.y);
    ctx.fillStyle = x.c; ctx.fillText(x.s, x.x, x.y);
  }
  ctx.globalAlpha = 1;
}

/* ---------------- HUD / banner / screens ---------------- */
var lastHud = "";
function syncHud(force) {
  var key = G.score + "|" + P.lives + "|" + P.bombs + "|" + G.stage + "|" + Math.round(G.mult * 10) + "|" + save.best + "|" + P.level + "|" + P.shield;
  if (key === lastHud && !force) { return; }
  lastHud = key;
  $("#hScore").textContent = G.score.toLocaleString();
  $("#hBest").textContent = Math.max(save.best, G.score).toLocaleString();
  $("#hStage").textContent = G.stage;
  $("#hMult").textContent = "x" + G.mult.toFixed(1) + "  P" + P.level + (P.shield ? " S" + P.shield : "");
  var i, s1 = "", s2 = "";
  for (i = 0; i < Math.max(0, P.lives); i++) { s1 += "\u25C6"; }
  for (i = 0; i < Math.max(0, P.bombs); i++) { s2 += "\u273F"; }
  $("#hLives").textContent = s1;
  $("#hBombs").textContent = s2;
  var bb = $("#btnBomb");
  if (bb) { bb.classList.toggle("empty", P.bombs <= 0); }
}
function syncBossBar() {
  var hp = 0, mx = 0;
  for (var i = 0; i < enemies.length; i++) {
    var e = enemies[i];
    if (e.kind === "boss" && !e.dead) { hp += Math.max(0, e.hp); mx += e.maxhp; }
  }
  if (mx > 0) {
    var ratio = clamp(hp / mx, 0, 1);
    $("#bossBar").style.width = (ratio * 100).toFixed(1) + "%";
    $("#bossWrap").classList.toggle("danger", ratio < 0.35);
  }
}
function banner(txt, cls) {
  var b = $("#banner");
  b.className = ""; void b.offsetWidth;
  b.textContent = txt;
  b.className = "show " + (cls || "");
}
function show(id) {
  var list = document.querySelectorAll(".screen");
  for (var i = 0; i < list.length; i++) { list[i].classList.add("hidden"); }
  if (id) { $(id).classList.remove("hidden"); }
}
function applyLang() {
  document.documentElement.lang = save.lang;
  var list = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < list.length; i++) { list[i].textContent = t(list[i].getAttribute("data-i18n")); }
  $("#howBody").textContent = t("ctrl_pc") + "\n" + t("ctrl_touch") + "\n" + t("how2");
}
function syncUI() {
  applyLang();
  $("#bCont").classList.toggle("hidden", !(save.unlocked > 1));
  $("#bCont").textContent = t("cont", { n: save.unlocked });
  $("#tBest").textContent = save.best.toLocaleString();
  $("#tStage").textContent = save.bestStage;
  $("#tKills").textContent = save.kills.toLocaleString();
  $("#tPlays").textContent = save.plays;
  $("#bMusic").textContent = t("music") + "  " + (save.music ? t("on") : t("off"));
  $("#bSfx").textContent = t("sfx") + "  " + (save.sfx ? t("on") : t("off"));
  $("#bMusic2").textContent = save.music ? t("on") : t("off");
  $("#bSfx2").textContent = save.sfx ? t("on") : t("off");
  $("#bMusic").classList.toggle("on", save.music);
  $("#bSfx").classList.toggle("on", save.sfx);
  $("#bMusic2").classList.toggle("on", save.music);
  $("#bSfx2").classList.toggle("on", save.sfx);
  var dl = document.querySelectorAll("[data-diff]");
  for (var i = 0; i < dl.length; i++) {
    var d = dl[i].getAttribute("data-diff");
    dl[i].textContent = t(d);
    dl[i].classList.toggle("sel", save.diff === d);
  }
  var cl = document.querySelectorAll(".chip[data-lang]");
  for (var j = 0; j < cl.length; j++) { cl[j].classList.toggle("sel", save.lang === cl[j].getAttribute("data-lang")); }
}

/* ---------------- input ---------------- */
window.addEventListener("keydown", function (e) {
  var kc = e.code;
  if (kc === "ArrowUp" || kc === "ArrowDown" || kc === "ArrowLeft" || kc === "ArrowRight" || kc === "Space" || kc === "Escape") {
    e.preventDefault();
  }
  keys[kc] = true;
  A.init(); A.resume();
  if (e.repeat) { return; }
  var pauseShown = !$("#sPause").classList.contains("hidden");
  var resultShown = !$("#sResult").classList.contains("hidden");
  if (kc === "Escape" || kc === "KeyP") {
    if (G.mode === "play") { doPause(true); } else if (pauseShown) { doPause(false); }
    return;
  }
  if ((kc === "KeyX" || kc === "KeyB") && G.mode === "play") { useBomb(); return; }
  if (kc === "Enter" || kc === "Space") {
    if (G.mode === "title") { startRun(1); }
    else if (resultShown && kc === "Enter") { startRun(G.stage); }
    else if (pauseShown && kc === "Enter") { doPause(false); }
  }
});
window.addEventListener("keyup", function (e) { keys[e.code] = false; });

function toLocal(e) {
  var r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / Math.max(1, r.width) * W, y: (e.clientY - r.top) / Math.max(1, r.height) * H };
}
cvs.addEventListener("pointerdown", function (e) {
  A.init(); A.resume();
  if (cvs.setPointerCapture) { try { cvs.setPointerCapture(e.pointerId); } catch (err) {} }
  if (G.mode === "title") { startRun(1); return; }
  if (G.mode === "play" && P.alive) {
    var p = toLocal(e);
    ptr = { id: e.pointerId, sx: p.x, sy: p.y, px: P.x, py: P.y };
  }
});
cvs.addEventListener("pointermove", function (e) {
  if (!ptr || e.pointerId !== ptr.id) { return; }
  var p = toLocal(e);
  P.tx = clamp(ptr.px + (p.x - ptr.sx), 16, W * 0.74);
  P.ty = clamp(ptr.py + (p.y - ptr.sy) - 32, 16, H - 16);
});
function endPtr(e) { if (ptr && e.pointerId === ptr.id) { ptr = null; } }
cvs.addEventListener("pointerup", endPtr);
cvs.addEventListener("pointercancel", endPtr);
cvs.addEventListener("contextmenu", function (e) { e.preventDefault(); });

function doPause(on) {
  if (on && G.mode === "play") {
    G.mode = "pause"; show("#sPause");
    if (A.mg) { A.mg.gain.value = save.music ? 0.35 : 0; }
  } else if (!on && G.mode === "pause") {
    G.mode = "play"; show(null);
    if (A.mg) { A.mg.gain.value = save.music ? 1 : 0; }
  }
}
document.addEventListener("visibilitychange", function () { if (document.hidden && G.mode === "play") { doPause(true); } });

/* buttons */
function setMusic(v) { save.music = v; persist(); A.init(); if (A.mg) { A.mg.gain.value = v ? 1 : 0; } MUS.start(); syncUI(); }
function setSfx(v) { save.sfx = v; persist(); A.init(); A.sfx("ui"); syncUI(); }
function goFS() {
  var el = $("#stage");
  var isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if (!isFs) {
    var rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rq) { try { rq.call(el); } catch (e) {} }
    setTimeout(function () {
      var o = navigator.screen && navigator.screen.orientation;
      if (o && o.lock) { o.lock("landscape").catch(function () {}); }
    }, 250);
  } else {
    var ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) { try { ex.call(document); } catch (e) {} }
  }
}
function on(id, fn) {
  var el = $(id);
  if (el) { el.addEventListener("click", function (e) { e.preventDefault(); A.init(); A.resume(); A.sfx("ui"); fn(); }); }
}
on("#bStart", function () { startRun(1); });
on("#bCont", function () { startRun(clamp(save.unlocked, 1, 99)); });
on("#bSet", function () { show("#sSet"); });
on("#bSetBack", function () { toTitle(); });
on("#bHow", function () { show("#sHow"); });
on("#bHow2", function () { show("#sHow"); });
on("#bHowBack", function () { show(G.mode === "pause" ? "#sPause" : "#sTitle"); });
on("#bResume", function () { doPause(false); });
on("#bQuit", function () { save.best = Math.max(save.best, G.score); persist(); toTitle(); });
on("#bRetry", function () { startRun(G.stage); });
on("#bTitle", function () { toTitle(); });
on("#bMusic", function () { setMusic(!save.music); });
on("#bMusic2", function () { setMusic(!save.music); });
on("#bSfx", function () { setSfx(!save.sfx); });
on("#bSfx2", function () { setSfx(!save.sfx); });
on("#btnPause", function () { if (G.mode === "play") { doPause(true); } else if (G.mode === "pause") { doPause(false); } });
on("#btnFs", goFS);
on("#bFs2", goFS);
on("#btnBomb", function () { useBomb(); });
/* タッチでは click 待ちだと遅いので pointerdown でも即発射（bombT のクールダウンで二重発射は防げる） */
var bombBtn = $("#btnBomb");
if (bombBtn) {
  bombBtn.addEventListener("pointerdown", function (e) {
    e.preventDefault(); A.init(); A.resume(); useBomb();
  }, { passive: false });
}
var dl2 = document.querySelectorAll("[data-diff]");
for (var di = 0; di < dl2.length; di++) {
  (function (el) {
    el.addEventListener("click", function () { save.diff = el.getAttribute("data-diff"); persist(); A.init(); A.sfx("ui"); syncUI(); });
  })(dl2[di]);
}
function langChips(host) {
  for (var i = 0; i < LANGS.length; i++) {
    (function (L) {
      var b = document.createElement("button");
      b.className = "chip"; b.textContent = L.n; b.setAttribute("data-lang", L.c);
      b.addEventListener("click", function () { save.lang = L.c; persist(); A.init(); A.sfx("ui"); syncUI(); });
      host.appendChild(b);
    })(LANGS[i]);
  }
}
langChips($("#langChips"));
langChips($("#langChips2"));
on("#bReset", function () {
  if (window.confirm(t("reset_q"))) {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    var keepLang = save.lang;
    save = defaults(); save.lang = keepLang;
    persist(); syncUI();
  }
});
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function () { setTimeout(fit, 120); });
window.addEventListener("beforeunload", persist);

/* ---------------- main loop ---------------- */
var last = performance.now();
function frame(now) {
  var raw = Math.min(0.05, (now - last) / 1000);
  last = now;
  fit();
  var dt = raw;
  if (G.slow > 0) { G.slow -= raw; dt = raw * 0.38; }
  if (G.mode === "play" || G.mode === "clearing" || G.mode === "title") {
    G.t += dt;
    bgUpdate(dt);
    if (G.mode === "play") {
      G.stageT += dt;
      while (G.qi < G.q.length && G.stageT >= G.q[G.qi].t) { spawnEvent(G.q[G.qi]); G.qi++; }
      if (!G.warned && G.stageT >= G.bossAt - 2.8) { G.warned = true; banner(t("warning"), "warn"); A.sfx("warn"); }
      if (!G.bossSpawned && G.stageT >= G.bossAt) { G.bossSpawned = true; spawnEvent({ k: "boss" }); }
    } else if (G.mode === "clearing") {
      G.clearT -= raw;
      if (G.clearT <= 0) { startStage(G.stage + 1); }
    } else {
      G.titleSpawn -= dt;
      if (G.titleSpawn <= 0) {
        G.titleSpawn = rnd(0.7, 1.5);
        var k = pick(["drone", "dart", "chaser", "drone", "sine"]);
        if (k === "dart") { var y = rnd(60, H - 60); addEnemy("dart", W + 30, y, { ang: Math.PI + rnd(-0.12, 0.12) }); }
        else if (k === "sine") { addEnemy("drone", W + 30, rnd(80, H - 80), { amp: rnd(50, 110), freq: rnd(1.6, 2.4) }); }
        else { addEnemy(k, W + 30 + rnd(0, 90), rnd(60, H - 60)); }
      }
    }
    playerUpdate(dt);
    enemiesUpdate(dt);
    bulletsUpdate(dt);
    ebulUpdate(dt);
    beamsUpdate(dt);
    itemsUpdate(dt);
    partsUpdate(dt);
    collisions();
    if (G.flash > 0) { G.flash = Math.max(0, G.flash - raw * 2.4); }
    if (G.shake > 0) { G.shake = Math.max(0, G.shake - raw * 46); }
    if (G.bombT > 0) { G.bombT = Math.max(0, G.bombT - raw); }
    if (G.mode === "play") { syncHud(false); }
    syncBossBar();
  } else {
    G.t += raw;
    bgUpdate(raw * 0.4);
    partsUpdate(raw);
  }
  MUS.update();
  render();
  requestAnimationFrame(frame);
}

/* boot */
bgInit(1);
fit();
syncUI();
show("#sTitle");
requestAnimationFrame(frame);
})();
</script>
